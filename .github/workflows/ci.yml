name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check download worker and local startup behavior
        run: npm run test:labor-worker
      - name: Check retained RA-5 synthetic fixture evidence without provider calls
        run: npm run test:ra5:fixtures
      - run: npm run build:web

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: manager-queue-browser-results
          path: test-results/
          retention-days: 7

  database:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the local PostgreSQL 17 stack
        run: npm run db:start
      - name: Replay every Git migration from a clean database
        run: npm run db:reset
      - name: Run applied permission, lifecycle, and manager queue checks
        run: npm run test:applied
        env:
          SVL_APPLIED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Check concurrent duplicate approvals
        run: npm run test:email:concurrency
        env:
          SVL_APPLIED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Check concurrent labor persistence and role changes
        run: node scripts/labor-persistence-concurrency.mjs
        env:
          SVL_APPLIED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SVL_LABOR_PERSISTENCE_QA: isolated-disposable
      - name: Reset disposable ledger before independent approval races
        run: npm run db:reset
      - name: Check concurrent labor approvals, manual sends and dispatch expiry
        run: node scripts/labor-approval-concurrency.mjs
        env:
          SVL_APPLIED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SVL_LABOR_APPROVAL_QA: isolated-disposable
      - name: Stop the local stack
        if: always()
        run: npm run db:stop
