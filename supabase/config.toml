# Supabase CLI local-development configuration.
# Keep this aligned with both hosted projects; neither project ref nor any secret belongs here.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "svl-receipts"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# svl-receipts-dev and svl-receipts-prod both run PostgreSQL 17.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# RA-2 has no seed data. Applied checks create their own data inside a rolled-back transaction.
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
